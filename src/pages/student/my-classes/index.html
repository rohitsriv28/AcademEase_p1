<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Booked Classes</title>
    <link rel="stylesheet" href="/src/assets/css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div id="sidebar-container"></div>
    <main class="content">
      <div class="dashboard-card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <h2>My Booked Classes</h2>
        </div>

        <!-- Tab Filter System -->
        <div class="tab-container">
          <button class="tab-btn active" id="tabUpcoming">
            Upcoming Classes
          </button>
          <button class="tab-btn" id="tabScheduled">All Scheduled</button>
          <button class="tab-btn" id="tabCompleted">Completed Classes</button>
        </div>

        <div id="classesListContainer">
          <table>
            <thead>
              <tr>
                <th>Tutor Name</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="classesTableBody">
              <!-- Dynamically filled -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Reschedule Modal -->
    <div class="modal-overlay" id="rescheduleModal">
      <div class="modal-box">
        <h3>Reschedule Class</h3>
        <p style="color: #64748b; font-size: 13px; margin-bottom: 15px">
          Choose a new date and time for your session.
        </p>
        <input type="hidden" id="rescheduleBookingId" />
        <input type="hidden" id="rescheduleTeacherId" />

        <label>Select Date</label>
        <input type="date" id="newDateInput" required />

        <label>Select Time</label>
        <select id="newTimeSelect" required>
          <option value="" disabled selected>Select Time</option>
          <option value="10:00">10:00 AM</option>
          <option value="11:00">11:00 AM</option>
          <option value="12:00">12:00 PM</option>
          <option value="13:00">01:00 PM</option>
          <option value="14:00">02:00 PM</option>
          <option value="15:00">03:00 PM</option>
          <option value="16:00">04:00 PM</option>
          <option value="17:00">05:00 PM</option>
        </select>

        <div class="modal-actions">
          <button class="btn btn-secondary" id="closeRescheduleBtn">
            Cancel
          </button>
          <button class="btn btn-primary" id="confirmRescheduleBtn">
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/pages/student/my-classes/index.js"></script>
  </body>
</html>
