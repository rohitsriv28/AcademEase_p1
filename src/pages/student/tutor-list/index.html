<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Find Tutors</title>
    <link rel="stylesheet" href="/src/assets/css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .search-box {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .search-box input {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
      }
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
      }
      .tutor-card {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        text-align: center;
        padding-bottom: 15px;
        border: 1px solid #eee;
      }
      .tutor-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }
      .tutor-card h3 {
        margin: 15px 0 5px;
        color: #333;
      }
      .tutor-card p {
        color: #666;
        font-size: 14px;
        margin-bottom: 15px;
        padding: 0 15px;
      }

      /* Modal styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1001;
      }
      .modal-box {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        width: 400px;
      }
      .modal-box input,
      .modal-box select {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div id="sidebar-container"></div>
    <main class="content">
      <div class="dashboard-card">
        <h2>Search Subjects & Tutors</h2>
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Search by subject name..."
          />
          <button class="btn btn-primary" id="searchBtn">Search</button>
        </div>
        <div class="cards-grid" id="tutorsContainer">
          <!-- Dynamically filled -->
        </div>
      </div>
    </main>

    <div class="modal-overlay" id="bookingModal">
      <div class="modal-box">
        <h3>Book a Class</h3>
        <br />
        <p id="bookingSubTitle" style="margin-bottom: 15px; color: #555"></p>
        <input type="hidden" id="bookSubjectId" />
        <input type="hidden" id="bookTeacherId" />

        <label>Select Date</label>
        <input type="date" id="bookDate" required />

        <label>Select Time</label>
        <select id="bookTime" required>
          <option value="" disabled selected>Select Time</option>
          <option value="10:00">10:00 AM</option>
          <option value="11:00">11:00 AM</option>
          <option value="12:00">12:00 PM</option>
          <option value="13:00">01:00 PM</option>
          <option value="14:00">02:00 PM</option>
          <option value="15:00">03:00 PM</option>
          <option value="16:00">04:00 PM</option>
          <option value="17:00">05:00 PM</option>
        </select>

        <div class="modal-actions">
          <button class="btn" id="closeModalBtn" style="background: #ccc">
            Cancel
          </button>
          <button class="btn btn-primary" id="confirmBookBtn">
            Confirm Booking
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/pages/student/tutor-list/index.js"></script>
  </body>
</html>
